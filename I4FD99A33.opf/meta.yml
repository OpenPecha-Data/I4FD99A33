source_metadata:
  id: RDI-KK-02
  title: ལག་ལེན་སུམ་སྦྲེལ་གྱི་གདམས་པ་གཅེས་བཏུས།
  author: མཛད་པ་པོ། མཁན་པོ་དྲི་མེད་བློ་གྲོས།, མཛད་པ་པོ། མཁན་པོ་རིན་ཆེན་དར་རྒྱས།, མཛད་པ་པོ།
    སངས་རྒྱས།, མཛད་པ་པོ། ཞྭ་དམར་ལྔ་པ་དཀོན་མཆོག་ཡན་ལག, མཛད་པ་པོ། ཚེ་དབང་ཀུན་ཁྱབ།, མཛད་པ་པོ།
    འཇམ་མགོན་ཀོང་སྤྲུལ་ཡོན་ཏན་རྒྱ་མཚོ།, མཛད་པ་པོ། འཇམ་དབྱངས་མཁྱེན་བརྩེ་དབང་པོ།, མཛད་པ་པོ།
    སྐལ་བཟང་དོན་བརྒྱུད་ཉི་མ།, མཛད་པ་པོ། མི་ཕམ་ཕུན་ཚོགས་ཤེས་རབ།
  authors: &id001
  - མཛད་པ་པོ། མཁན་པོ་དྲི་མེད་བློ་གྲོས།
  - མཛད་པ་པོ། མཁན་པོ་རིན་ཆེན་དར་རྒྱས།

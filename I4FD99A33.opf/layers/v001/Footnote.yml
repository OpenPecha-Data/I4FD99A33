  e7133621c2a54974ab37ff3e9223353a:
    span:
      start: 23801
      end: 24120
    footnote_ref: ཞེས་དང༌། གསལ་བའི་རྒྱན་གཉིས་ནི། སྙན་གོང་གཡས་གཡོན་གཉིས་སུ་ཉི་ཟླའོ།
      །ཡང་ན་ལྷ་རྗེས་ ༡ ཉི་ཟླའི་ཕྲེང་བའང་བཞེད་ལ། བདེ་འདུས་རྩ་རྒྱུད་ཞི་ཁྲོ་མངོན་བྱུང་གི་རྒྱུད་ལས།
      དཔལ་གྱི་ཆས་བཅུ་ཞེས་མིང་མི་འདྲ་བ་ཡང་ཡོད། འདིར་རིག་འཛིན་མཆོག་གི་གཏེར་བྱོན་ཐུགས་སྒྲུབ་བར་ཆར་ཀུན་སེལ་ལས་དུར་ཁྲོད་ཆས་བརྒྱད་དང་དཔལ་གྱི་ཆས་བརྒྱད་བཤད་དེ།
      དེ་ཡང་གཏེར་གཞུང་ལས།
